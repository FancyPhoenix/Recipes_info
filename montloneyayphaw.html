<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="recipe-container">
        <p class="ingredients-title">ပါဝင်ပစ္စည်းများ</p>
        <ul class="ingredients">
            <li>ကောက်ညှင်းမှုန့်၊ ဆန်မှုန့်</li>
            <li>ထန်းလျက်</li>
            <li>အုန်းသီးခြစ်</li>
        </ul>
        ပြုလုပ်နည်းအဆင့်ဆင့်
        <ol class="steps">
            <li>မှုန့်များကို ရေဖြင့်နယ်၍ အလုံးလေးများ ပြုလုပ်ပါ။</li>
            <li>အလယ်တွင် ထန်းလျက်တုံးလေးများ ထည့်ပါ။</li>
            <li>ဆူပွက်နေသော ရေနွေးအိုးထဲ ထည့်ပြုတ်ပါ။ မုန့်လုံးများ ပေါ်လာလျှင် ဆယ်ယူပါ။</li>
        </ol>
        <div class="button-container"><a href="index.html" id="button-anchor"><button class="home-button">Back To Home</button></a></div>
    </body>
</html>
