<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="recipe-container">
        <p class="ingredients-title">ပါဝင်ပစ္စည်းများ</p>
        <ul class="ingredients">
            <li>မုန့်ဟင်းခါးဖတ်</li>
            <li>ပဲသီး၊ ကြက်သွန်နီလှီးပြီး</li>
            <li>ငါးငံပြာရည်၊ ငရုတ်သီးမှုန့်၊ သံပရာသီး</li>
        </ul>
        ပြုလုပ်နည်းအဆင့်ဆင့်
        <ol class="steps">
            <li>မုန့်ဖတ်ကို ဇလုံထဲထည့်ပြီး အသီးအရွက်များ ထည့်ပါ။</li>
            <li>ငံပြာရည်၊ ဆီချက်နှင့် အချိုမှုန့်အနည်းငယ်ထည့်ပါ။</li>
            <li>သံပရာရည်ညှစ်၍ သမအောင်နယ်ပြီး သုံးဆောင်ပါ။</li>
        </ol>
        <div class="button-container"><a href="index.html" id="button-anchor"><button class="home-button">Back To Home</button></a></div>
    </body>
</html>
