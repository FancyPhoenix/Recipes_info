<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="recipe-container">
        <p class="ingredients-title">ပါဝင်ပစ္စည်းများ</p>
        <ul class="ingredients">
            <li>သာကူစေ့</li>
            <li>အုန်းနို့၊ သကြား</li>
            <li>ဆားအနည်းငယ်</li>
        </ul>
        ပြုလုပ်နည်းအဆင့်ဆင့်
        <ol class="steps">
            <li>သာကူစေ့ကို ရေဆေးပြီး ရေနွေးဖြင့် မျက်စိပျောက်အောင် ကျိုပါ။</li>
            <li>သကြားနှင့် အုန်းနို့ထည့်၍ ပျစ်လာသည်အထိ မွှေပေးပါ။</li>
            <li>ဗန်းထဲထည့်၍ အအေးခံကာ အတုံးတုံးပြီး စားသုံးပါ။</li>
        </ol>
        <div class="button-container"><a href="index.html" id="button-anchor"><button class="home-button">Back To Home</button></a></div>
    </body>
</html>
