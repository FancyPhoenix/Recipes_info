<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="recipe-container">
        <p class="ingredients-title">ပါဝင်ပစ္စည်းများ</p>
        <ul class="ingredients">
            <li>ထမင်းဖြူ</li>
            <li>ငါးပြုတ်အသားနွှာပြီး</li>
            <li>အာလူးပြုတ်၊ နနွင်း</li>
            <li>ကြက်သွန်ဖြူဆီချက်</li>
        </ul>
        ပြုလုပ်နည်းအဆင့်ဆင့်
        <ol class="steps">
            <li>ထမင်းပူပူကို နနွင်း၊ အာလူးပြုတ်၊ ငါးအသားတို့ဖြင့် ရောနယ်ပါ။</li>
            <li>ဆီချက်နှင့် ဆားအနည်းငယ်ထည့်၍ သမအောင် နယ်ပါ။</li>
            <li>အဝိုင်းပုံစံပြုလုပ်၍ အပေါ်မှ ကြက်သွန်ဖြူကြော်ဖြူးပါ။</li>
        </ol>
        <div class="button-container"><a href="index.html" id="button-anchor"><button class="home-button">Back To Home</button></a></div>
    </body>
</html>
